<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FL for IoT | Research Portfolio</title>
  <meta name="description" content="FL for IoT - research paper in the portfolio.">
  <meta property="og:title" content="FL for IoT">
  <meta property="og:type" content="article">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">

  <!-- Global design system -->
  <link rel="stylesheet" href="styles.css">

  <!-- KaTeX (math rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    [hidden] { display: none !important; }

    /* Header */
    .back-link {
      display: inline-block;
      padding: 0.25rem 0 2px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-navy);
      background: linear-gradient(var(--accent-gold), var(--accent-gold)) no-repeat 0 100% / 0 3px;
      cursor: pointer;
    }
    .back-link:hover,
    .back-link:focus-visible { background-size: 100% 3px; }

    /* Hero */
    .paper-hero {
      padding-top: clamp(2rem, 6vw, 4rem);
      padding-bottom: clamp(1.5rem, 4vw, 2.5rem);
    }
    .paper-hero > * + * { margin-top: var(--space-4); }
    .paper-status .badge:empty,
    .paper-topics:empty { display: none; }
    .paper-topics {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .paper-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding-top: var(--space-2);
    }
    #link-btn[href=""] { display: none; }

    /* Body */
    .paper-content {
      flex: 0 0 auto;
      padding-block: var(--space-5) var(--space-7);
    }
    .paper-content > section + section { margin-top: clamp(2.5rem, 6vw, 4rem); }
    .paper-content section > h2 { margin-bottom: var(--space-4); }

    /* Timeline UI Enhancements */
    .timeline-container {
      margin-top: 1.5rem;
      padding-left: 1.75rem;
      border-left: 2px solid var(--line, #e2e8f0);
      position: relative;
    }
    .timeline-item {
      position: relative;
      padding-bottom: 2.5rem;
    }
    .timeline-item:last-child {
      padding-bottom: 0;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -1.75rem; /* Matches container padding */
      top: 0.35rem;
      width: 0.75rem;
      height: 0.75rem;
      background-color: #fff;
      border: 2px solid var(--primary-navy, #0f172a);
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 1;
    }
    .timeline-date {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-navy, #0f172a);
      background-color: var(--surface, #f1f5f9);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--line, #e2e8f0);
      margin-bottom: 0.75rem;
    }
    .timeline-content > *:first-child { margin-top: 0; }
    .timeline-content > *:last-child { margin-bottom: 0; }
    
    /* Citation */
    .paper-citation { padding-bottom: clamp(3rem, 8vw, 5rem); }
    .paper-citation details {
      padding-top: var(--space-4);
      border-top: 1px solid var(--line);
    }
    .paper-citation summary {
      padding-block: 0.5rem;
      font-weight: 600;
      color: var(--primary-navy);
      cursor: pointer;
    }
    .paper-citation .code-block { margin-top: var(--space-3); }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="site-header__inner" aria-label="Primary">
      <a class="back-link" id="back-link" href="index.html"><span aria-hidden="true">&larr;</span> Back to Portfolio</a>
      <a class="site-logo" href="index.html">Your Name</a>
    </nav>
  </header>

  <!-- Paper header -->
  <section class="paper-hero container container--narrow" aria-labelledby="paper-title">
    <div class="paper-status" id="paper-status"><span class="badge" id="status-badge">On-going</span></div>
    <h1 id="paper-title">FL for IoT</h1>
    <div class="paper-topics" id="paper-topics" aria-label="Topics"></div>
    <div class="paper-actions">
      <a href="" class="btn" id="link-btn" target="_blank" rel="noopener noreferrer">View Artifact</a>
      <button type="button" class="btn btn-outline" id="copy-bibtex">Copy BibTeX</button>
      <span class="sr-only" id="copy-status" role="status"></span>
    </div>
  </section>

  <!-- Abstract and timeline sections are generated from Notion -->
  <main class="paper-content container container--narrow" id="main"><section class="timeline"><h2>Timeline</h2><p>2023-01-09: Laid out plan</p><p>2026-05-07: Built the baselines</p><p>2026-05-07: Built the baselines</p><p>2026-05-07: Built the baselines</p><p>2026-05-07: Built the baselines</p></section></main>

  <!-- Collapsed citation block -->
  <section class="paper-citation container container--narrow" id="citation" aria-label="Citation">
    <details>
      <summary>Cite this paper</summary>
      <pre class="code-block"><code id="bibtex-block"></code></pre>
    </details>
  </section>

  <script>
    (function () {
      'use strict';

      function byId(id) { return document.getElementById(id); }

      function safely(label, fn) {
        try { fn(); } catch (err) {
          if (window.console) { console.error('[paper-template] ' + label + ' failed:', err); }
        }
      }

      /* Smart Back Tracking */
      function initBackTracking() {
        var link = byId('back-link');
        if (!link) { return; }
        if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            window.history.back();
          });
        }
      }

      /* 1. Status badge */
      function initStatusBadge() {
        var badge = byId('status-badge');
        var wrap = byId('paper-status');
        if (!badge) { return; }
        var text = (badge.textContent || '').trim();
        if (!text) {
          if (wrap) { wrap.hidden = true; }
          return;
        }
        var key = text.toLowerCase().replace(/[^a-z]/g, '');
        var classes = {
          published: 'badge-published',
          ongoing: 'badge-ongoing',
          inreview: 'badge-review'
        };
        if (classes[key]) { badge.classList.add(classes[key]); }
      }

      /* 2. Topics */
      function initTopics() {
        var topics = byId('paper-topics');
        if (topics && !(topics.textContent || '').trim()) { topics.hidden = true; }
      }

      /* 3. Link button */
      function initLinkButton() {
        var btn = byId('link-btn');
        if (!btn) { return; }
        var href = (btn.getAttribute('href') || '').trim();
        if (!/^https?:\/\//i.test(href)) {
          btn.hidden = true;
          btn.removeAttribute('href');
        }
      }

      /* 4. Timeline */
      // Captures the date block and any trailing colon/dash/space so it gets cleanly removed from content
      var DATE_RE = /^\s*(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})\s*[:\-]?\s*/;

      function structureTimeline() {
        var section = document.querySelector('main section.timeline');
        if (!section || section.querySelector('.timeline-container')) { return; }

        var container = document.createElement('div');
        container.className = 'timeline-container';

        var current = null;
        var body = null;
        var count = 0;

        Array.prototype.slice.call(section.children).forEach(function (el) {
          if (el.tagName === 'H2') return; // Skip the main "Timeline" header

          var text = el.textContent || '';
          var match = text.match(DATE_RE);

          if (match) {
            // Initiate a new timeline event
            current = document.createElement('div');
            current.className = 'timeline-item';

            var dateEl = document.createElement('div');
            dateEl.className = 'timeline-date';
            dateEl.textContent = match[1];

            body = document.createElement('div');
            body.className = 'timeline-content';

            // Clone element and string replace the date prefix from the first text node
            var clone = el.cloneNode(true);
            var walker = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT, null, false);
            var firstText = walker.nextNode();
            if (firstText) {
              firstText.nodeValue = firstText.nodeValue.replace(DATE_RE, '');
            }

            // Only append the cloned node if there is text left aside from the date
            if (clone.textContent.trim() !== '') {
              body.appendChild(clone);
            }

            current.appendChild(dateEl);
            current.appendChild(body);
            container.appendChild(current);
            count += 1;
          } else if (current) {
            // Append continuation paragraphs to the most recent date entry
            body.appendChild(el.cloneNode(true));
          } else {
             // Edge case: Blocks placed before the very first date item
            container.appendChild(el.cloneNode(true));
          }
        });

        if (!count) { return; }
        
        // Remove old nodes from section (preserve only H2)
        Array.prototype.slice.call(section.children).forEach(function(el) {
           if (el.tagName !== 'H2') { section.removeChild(el); }
        });
        
        section.appendChild(container);
      }

      /* 5. Prose styling */
      function enhanceProse() {
        var nodes = document.querySelectorAll('main section.abstract, main .timeline-content');
        Array.prototype.forEach.call(nodes, function (node) { node.classList.add('prose'); });
      }

      /* 6. Copy BibTeX */
      function initCopyBibtex() {
        var block = byId('bibtex-block');
        var btn = byId('copy-bibtex');
        var citation = byId('citation');
        var status = byId('copy-status');
        var text = block ? (block.textContent || '').trim() : '';

        if (!text) {
          if (btn) { btn.hidden = true; }
          if (citation) { citation.hidden = true; }
          return;
        }
        if (!btn) { return; }

        var label = btn.textContent;
        var timer = null;

        function flash(message) {
          btn.textContent = message;
          if (status) { status.textContent = message; }
          clearTimeout(timer);
          timer = setTimeout(function () {
            btn.textContent = label;
            if (status) { status.textContent = ''; }
          }, 2000);
        }

        function fallbackCopy() {
          var area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.top = '-9999px';
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(area);
          return ok;
        }

        btn.addEventListener('click', function () {
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(
              function () { flash('Copied!'); },
              function () { flash(fallbackCopy() ? 'Copied!' : 'Copy failed'); }
            );
          } else {
            flash(fallbackCopy() ? 'Copied!' : 'Copy failed');
          }
        });
      }

      /* 7. KaTeX auto-render */
      function renderMath() {
        var root = document.querySelector('main');
        if (!root || typeof window.renderMathInElement !== 'function') { return; }
        window.renderMathInElement(root, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false
        });
      }

      function run() {
        safely('back tracking', initBackTracking);
        safely('status badge', initStatusBadge);
        safely('topics', initTopics);
        safely('link button', initLinkButton);
        safely('timeline', structureTimeline);
        safely('prose', enhanceProse);
        safely('copy bibtex', initCopyBibtex);
        safely('math', renderMath);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
